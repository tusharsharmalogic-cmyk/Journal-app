plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tushar.journal'
    compileSdk 34

    defaultConfig {
        applicationId "com.tushar.journal"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        journal {
            def ks = rootProject.file('journal.p12')
            if (ks.exists() && System.getenv('KEYSTORE_PASSWORD')) {
                storeFile ks
                storeType 'pkcs12'
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'journal'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (rootProject.file('journal.p12').exists() && System.getenv('KEYSTORE_PASSWORD')) {
                signingConfig signingConfigs.journal
            }
        }
        release {
            minifyEnabled false
            if (rootProject.file('journal.p12').exists() && System.getenv('KEYSTORE_PASSWORD')) {
                signingConfig signingConfigs.journal
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}